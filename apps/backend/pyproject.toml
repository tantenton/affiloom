[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "affiloom-backend"
version = "0.2.0"
description = "Affiloom backend — FastAPI microservice"
authors = [{ name = "Affiloom Team", email = "" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi >=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.3",
    "alembic>=1.13.1",
    "redis>=5.0.4",
    "aio-pika>=9.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
]

[tool.hatch.build.targets.wheel]
packages = [
    "adapters",
    "db",
    "routers",
    "schemas",
    "services",
    "workers",
    "config.py",
    "dependencies.py",
    "main.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
line_length = 88
