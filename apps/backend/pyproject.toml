[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "affiloom-backend"
version = "0.1.0"
description = "Affiloom backend — FastAPI microservice"
authors = [{ name = "Affiloom Team", email = "" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi >=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.select]
E = "error-code"
W = "whitespace"
F = "flake8-bugbear"
C = "complexity"
I = "imports"
D = "docstring"
S = "security"
A = "asgi"

[tool.ruff.per-file-ignores]

[tool.mypy]
line_length = 88
