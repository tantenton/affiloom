line-length = 88
target-version = "py311"

[lint]
select = ["E", "W", "F", "C", "I", "D", "S", "A"]
ignore = [
    # Docstring rules we intentionally skip for thin packages / boilerplate.
    "D100", "D101", "D102", "D103", "D104", "D107",
    # Swallowed exceptions are best-effort by design (Redis/Rabbit/Meili degrade
    # silently when unreachable); logging would be noise, not signal.
    "S110",
]

[lint.per-file-ignores]
"__init__.py" = ["I001"]
"test_*.py" = ["S101", "E501"]
"migrations/versions/*" = ["E501", "D415"]

[lint.pydocstyle]
convention = "google"
