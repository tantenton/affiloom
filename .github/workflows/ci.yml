name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v2
        with:
          version: "0.4.0"
      - run: uv sync --frozen
      - name: Migration check (SQLite)
        run: |
          rm -f /tmp/affiloom-ci.db
          DATABASE_URL="sqlite+aiosqlite:////tmp/affiloom-ci.db" uv run alembic upgrade head
          DATABASE_URL="sqlite+aiosqlite:////tmp/affiloom-ci.db" uv run alembic check
          DATABASE_URL="sqlite+aiosqlite:////tmp/affiloom-ci.db" uv run alembic downgrade base
      - run: uv run pytest tests/ -q
